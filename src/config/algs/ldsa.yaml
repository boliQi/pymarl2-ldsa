# --- LDSA specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000

runner: "parallel"
batch_size_run: 8
buffer_size: 2500
batch_size: 64
optimizer: "adam"

t_max: 10050000

# update the target network every {} episodes
target_update_interval: 200

# use the Q_Learner to train
mac: "ldsa_mac"
agent: "ldsa"
agent_output_type: q

learner: "ldsa_learner"
double_q: True
mixer: "qmix"
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64
lr: 0.001

name: "ldsa"

n_subtasks: 4
agent_subtask_embed_dim: 64
sft_way: "gumbel_softmax" # softmax or gumbel_softmax
test_argmax: True
lambda_subtask_prob: 0.001
lambda_subtask_repr: 0.001
subtask_policy_use_hypernet: True
use_tanh: True
subtask_repr_layers: 2
random_sele: False # select a subtask randomly if True

# RECL + LLM analysis (parallel comparison mode)
use_recl_analysis: True
use_llm_for_labels: True
role_encoding_dim: 4
role_update_interval: 10
role_short_interval: 5
role_warm_up_limit: 20
train_recl_freq: 100
agent_embedding_dim: 128
role_embedding_dim: 64
recl_use_ln: False
use_big_model: False
load_pretrained_recl: True
pretrained_recl_path: "results/pretrained_roles/recl_net_pretrained_mixed_5000.pt"
pretrained_prototypes_path: "results/pretrained_roles/recl_net_pretrained_mixed_5000_prototypes.pt"
freeze_recl: True

